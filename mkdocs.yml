# Physical AI Playbook — MkDocs Material 구성
# 배포: GitHub Actions(.github/workflows/deploy-docs.yml) → GitHub Pages

site_name: Physical AI Playbook
site_description: AWS Korea SA용 Physical AI 참조 자산 — 아키텍처 방향·AWS 매핑·다음 액션을 5분 안에
site_url: https://comeddy.github.io/pai-playbook/
repo_url: https://github.com/comeddy/pai-playbook
edit_uri: edit/main/docs/
docs_dir: docs

nav:
  - 홈: index.md
  - 가이드: guide.md
  - "경영진 브리핑": exec.md
  - "임원 대화 가이드": exec-guide.md
  - "P1 · 데이터 수집 & 처리": pillar-1.md
  - "P2 · 모델 학습 (VLA)": pillar-2.md
  - "P3 · 시뮬레이션": pillar-3.md
  - "P4 · Sim-to-Real": pillar-4.md
  - "P5 · 에이전트 오케스트레이션": pillar-5.md
  - "의사결정 트리": decisions.md
  - "Radar (대기열)": radar.md
  - "유지보수 규칙": maintenance.md

theme:
  name: material
  custom_dir: overrides   # PWA 메타(main.html extrahead) — iPhone 홈 화면 standalone 앱
  favicon: assets/icons/favicon.png
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 다크 모드로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로
  features:
    - navigation.tabs      # 상단 가로 탭바 — 가이드 등 전 페이지를 헤더에 노출
    # navigation.instant 제거 — mkdocs-static-i18n 언어 전환기와 문서화된 비호환 (strict 빌드 게이트)
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy

markdown_extensions:
  - tables
  - attr_list
  - footnotes             # 용어 각주([^vla] 같은 명명 라벨) — 필러 페이지 하단 용어 설명에 사용
  - md_in_html            # <details markdown="1"> 내부 마크다운(표) 렌더링에 필수
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      # 한국어 헤딩 앵커 유지 (기본 slugify는 비ASCII를 제거해 페이지 내 링크가 깨짐)
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search:
      lang:
        - ko
        - en
        - ja
        # zh 형태소 분리는 v1 범위 외 (spec YAGNI) — lunr 기본 토크나이저로 수용
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: ko
          name: 한국어
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: "Physical AI reference asset for AWS Korea SA — architecture direction, AWS mapping, next actions in 5 minutes"
          nav_translations:
            홈: Home
            가이드: Guide
            "경영진 브리핑": "Executive Brief"
            "임원 대화 가이드": "Executive Conversation Guide"
            "P1 · 데이터 수집 & 처리": "P1 · Data Collection & Processing"
            "P2 · 모델 학습 (VLA)": "P2 · Model Training (VLA)"
            "P3 · 시뮬레이션": "P3 · Simulation"
            "P5 · 에이전트 오케스트레이션": "P5 · Agent Orchestration"
            "의사결정 트리": "Decision Trees"
            "Radar (대기열)": "Radar (Queue)"
            "유지보수 규칙": "Maintenance Rules"
        - locale: zh
          name: 中文
          build: true
          site_description: "面向 AWS Korea SA 的 Physical AI 参考资产 — 5 分钟内掌握架构方向、AWS 映射与后续行动"
          nav_translations:
            홈: 首页
            가이드: 指南
            "경영진 브리핑": "高管简报"
            "임원 대화 가이드": "高管对话指南"
            "P1 · 데이터 수집 & 처리": "P1 · 数据采集与处理"
            "P2 · 모델 학습 (VLA)": "P2 · 模型训练 (VLA)"
            "P3 · 시뮬레이션": "P3 · 仿真"
            "P5 · 에이전트 오케스트레이션": "P5 · 智能体编排"
            "의사결정 트리": "决策树"
            "Radar (대기열)": "Radar（队列）"
            "유지보수 규칙": "维护规则"
        - locale: ja
          name: 日本語
          build: true
          site_description: "AWS Korea SA 向け Physical AI リファレンス資産 — アーキテクチャの方向性・AWS マッピング・次のアクションを5分で"
          nav_translations:
            홈: ホーム
            가이드: ガイド
            "경영진 브리핑": "経営層ブリーフィング"
            "임원 대화 가이드": "経営層対話ガイド"
            "P1 · 데이터 수집 & 처리": "P1 · データ収集と処理"
            "P2 · 모델 학습 (VLA)": "P2 · モデル学習 (VLA)"
            "P3 · 시뮬레이션": "P3 · シミュレーション"
            "P5 · 에이전트 오케스트레이션": "P5 · エージェントオーケストレーション"
            "의사결정 트리": "意思決定ツリー"
            "Radar (대기열)": "Radar（キュー）"
            "유지보수 규칙": "メンテナンスルール"

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/comeddy/pai-playbook
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/zerojin/
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/pai-playbook.bsky.social
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/paiplaybook
    - icon: material/history
      link: https://github.com/comeddy/pai-playbook/blob/main/CHANGELOG.md
      name: Changelog (변경 이력)
