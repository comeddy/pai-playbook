name: "📌 Playbook 후보 제보 (슬랙 → playbook 승격)"
description: "고객 문제·1차 출처·근거 범위·소유자를 확인한 뒤 수록을 검토합니다."
title: "[후보] "
labels: ["candidate"]
body:
  - type: markdown
    attributes:
      value: |
        **승격 파이프라인**: 이 이슈 → owner가 고객 문제·출처·근거 범위·소유자를 모두 확인 → 사람 검토 후 수록 / 미확인 항목은 [Radar](https://comeddy.github.io/pai-playbook/radar/)에 유지.
        제출 전 [Radar](https://comeddy.github.io/pai-playbook/radar/)에 이미 있는지 먼저 확인하세요.

  - type: input
    id: item-name
    attributes:
      label: 항목명
      placeholder: "예: NVIDIA Isaac Lab 3.0 / Newton 물리엔진"
    validations:
      required: true

  - type: dropdown
    id: pillar
    attributes:
      label: 담당 필러
      options:
        - "P1 · 데이터 수집 & 처리"
        - "P2 · 모델 학습 (VLA)"
        - "P3 · 시뮬레이션"
        - "P4 · Sim-to-Real"
        - "P5 · 에이전트 오케스트레이션"
        - "decisions (교차 의사결정)"
        - "모르겠음 (owner가 판정)"
    validations:
      required: true

  - type: dropdown
    id: maturity
    attributes:
      label: 출시 상태
      description: "출시 상태와 현장 검증·권장 용도·지원 주체는 별개입니다."
      options:
        - "🟢 GA"
        - "🟡 Preview"
        - "🔵 Research-only"
        - "⚪ Hype (데모만)"
        - "해당 없음 (원리·규제·방법론)"
    validations:
      required: true

  - type: input
    id: source-url
    attributes:
      label: 출처 URL
      placeholder: "https://..."
    validations:
      required: true

  - type: dropdown
    id: source-tier
    attributes:
      label: 출처 등급
      options:
        - "[1] 공식 문서/논문"
        - "[2] 기록된 재현 실험 (버전·환경·로그 필요)"
        - "[3] 벤더 공식 블로그"
        - "[4] 미검증 (슬랙/소문)"
    validations:
      required: true

  - type: checkboxes
    id: the-filter
    attributes:
      label: "관련성 신호 — 이것만으로 수록·운영 검증을 승인하지 않습니다"
      description: "아래 항목은 참고 신호입니다. 수록 필수 조건은 다음 항목을 모두 채워야 합니다."
      options:
        - label: "ⓐ production 또는 실제 고객 배포에서 검증됨 (데모 영상만으로는 불충분)"
        - label: "ⓑ AWS 서비스/인프라와 구체적으로 매핑 가능"
        - label: "ⓒ 실제 고객 또는 SA가 물어본 이력이 있음"
        - label: "ⓓ GA이거나 명확한 GA 로드맵이 있음"

  - type: textarea
    id: evidence-scope
    attributes:
      label: "수록 필수 조건과 검토 기록"
      description: "고객 문제/R&D 질문, 정확한 1차 출처·버전·확인일, 근거 수준·한계·권장 용도·지원 주체, owner·다음 액션을 모두 적어 주세요. 실험은 표본·단위·환경·로그를 포함합니다."
    validations:
      required: true

  - type: textarea
    id: l0-tldr
    attributes:
      label: "L0 TL;DR (1~2문장)"
      description: "이게 무엇이고 언제 쓰는지. 수치·벤치마크 인용 시 날짜+출처+측정 조건 병기."
    validations:
      required: true

  - type: textarea
    id: customer-context
    attributes:
      label: "고객/SA 문의 맥락 (있으면)"
      description: "공개 가능한 업무 맥락만 기록하세요. 고객 기밀·사내 Slack 링크를 공개 이슈에 넣지 마세요."

  - type: input
    id: proposed-owner
    attributes:
      label: "승격 시 owner"
      description: "소유자 없는 항목은 본문에 생성하지 않는다(maintenance 규칙). owner는 항상 1명. 미정이면 비워두기."
      placeholder: "SA 이름"

  - type: input
    id: verifiers
    attributes:
      label: "1차 출처 검증자"
      description: "공식 발표·논문 원문·라이선스를 대조한 사람 — 여러 명이면 쉼표로 나열. 승격 시 항목 메타데이터의 `검증:` 필드에 기록됩니다."
      placeholder: "SA 이름, SA 이름"
