name: deploy-docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 매주 월요일 00:00 UTC 재배포 — 푸시가 없어도 staleness 배지가 갱신되도록
    - cron: "0 0 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # staleness 리포트 + 기준 초과 페이지에 '⏳ 검토 필요' 배지 주입
      # (워크스페이스에만 적용 — 저장소에 커밋되지 않음. 메타데이터 누락 시 빌드 실패)
      - run: python scripts/check_staleness.py --check
      - run: python scripts/check_staleness.py --inject
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
